[package]
name = "aichihongshu"
version = "0.1.0"
description = "爱吃红薯（AI吃红书）桌面客户端"
authors = ["you"]
edition = "2021"
default-run = "aichihongshu"

[[bin]]
name = "aichihongshu"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aichihongshu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aichihongshu-db = { path = "../core" }
aichihongshu-services = { path = "../services" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
libc = "0.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
