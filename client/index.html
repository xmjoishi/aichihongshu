<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爱吃红薯</title>
    <style>
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body { background: #fafafa; }
      .app-boot-splash {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        color: #71717a;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot-mark { color: #18181b; font-size: 20px; font-weight: 600; }
      .app-boot-progress { width: 140px; height: 3px; overflow: hidden; border-radius: 999px; background: #f4d8dd; }
      .app-boot-progress span { display: block; width: 45%; height: 100%; border-radius: inherit; background: #ff2442; animation: app-boot-slide 1.1s ease-in-out infinite; }
      @keyframes app-boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
    <script>
      // 滚动条策略按引擎分流（见 index.css）：WebKit（macOS WKWebView / Safari）用静态
      // 低对比细滑块（系统原生条粗且常驻）；Chromium 走静默浮现式；Firefox 走标准属性。
      // 须在首次渲染前设置。
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isWebKit = /AppleWebKit/i.test(ua) && !/Chrom(e|ium)|Edg\//i.test(ua);
          document.documentElement.setAttribute(
            "data-scrollbar-engine",
            isWebKit ? "webkit" : "chromium"
          );
        } catch (e) {
          /* 检测失败时不设置属性，CSS 默认走引擎原生滚动条。 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div class="app-boot-splash" role="status" aria-live="polite">
        <div class="app-boot-mark">爱吃红薯</div>
        <div class="app-boot-progress" aria-hidden="true"><span></span></div>
        <div>正在打开工作区…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
