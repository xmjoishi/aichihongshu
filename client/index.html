<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爱吃红薯</title>
    <script>
      // 滚动条策略按引擎分流（见 index.css）：WebKit（macOS WKWebView / Safari）用静态
      // 低对比细滑块（系统原生条粗且常驻）；Chromium 走静默浮现式；Firefox 走标准属性。
      // 须在首次渲染前设置。
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isWebKit = /AppleWebKit/i.test(ua) && !/Chrom(e|ium)|Edg\//i.test(ua);
          document.documentElement.setAttribute(
            "data-scrollbar-engine",
            isWebKit ? "webkit" : "chromium"
          );
        } catch (e) {
          /* 检测失败时不设置属性，CSS 默认走引擎原生滚动条。 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
